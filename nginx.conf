map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Docker's embedded DNS follows the app when its container is recreated.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream portfolio_app {
    zone portfolio_app 64k;
    server portfolio:3000 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-DNS-Prefetch-Control "on" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The App Router streams responses; preserve Next.js cache headers.
    proxy_buffering off;
    proxy_connect_timeout 5s;

    location / {
        proxy_pass http://portfolio_app;
    }

    location = /health.json {
        proxy_pass http://portfolio_app;
        access_log off;
        expires -1;
    }
}
